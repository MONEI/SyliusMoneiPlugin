            card_layout_help: Show the card fields on a single line, or as separate card number, expiry and CVC fields. Only card in onsite mode.
            card_layout_split: Separate fields
            card_layout_single: Single line
            account_id: Account ID
            account_id_help: Optional. Your MONEI account ID, from the MONEI dashboard. In onsite mode, the payment form then shows on the checkout page. Leave empty to keep the separate payment page.
