name: E2E

# Nightly run, plus the e2e job of ci.yaml on pull requests from this repository (workflow_call).
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  workflow_call:
    secrets:
      # Not required here: the job fails with a clear message when it is empty.
      MONEI_TEST_API_KEY:
        required: false

permissions:
  contents: read

# Every run shares one MONEI and PayPal sandbox, so a PR run and the nightly never run at the
# same time. A literal group: in a workflow_call run, github.workflow is the caller's name.
concurrency:
  group: monei-sandbox-e2e
  cancel-in-progress: false
  queue: max

jobs:
  e2e:
    name: E2E (PHP ${{ matrix.php }} / Sylius ${{ matrix.sylius }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # The jobs share one sandbox too.
      max-parallel: 1
      matrix:
        include:
          - php: '8.2'
            sylius: '2.2.12'
          - php: '8.4'
            sylius: '^2.3.2'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: e2e/package.json

      - name: Install dependencies
        run: pnpm --dir e2e install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --dir e2e exec playwright install --with-deps chromium

      # Compose (for the seed container) and the specs read the key from e2e/.env.
      - name: Write e2e/.env
        env:
          MONEI_TEST_API_KEY: ${{ secrets.MONEI_TEST_API_KEY }}
        run: |
          key="${MONEI_TEST_API_KEY//[$'\r\n']/}"
          if [ -z "$key" ]; then
            echo "::error::The MONEI_TEST_API_KEY repository secret is not set; the e2e suite cannot pay against MONEI."
            exit 1
          fi
          (umask 077 && printf 'MONEI_TEST_API_KEY=%s\n' "$key" >e2e/.env)

      # start.sh masks the tunnel host and the admin password as soon as it knows them.
      - name: Start the e2e stack
        env:
          SYLIUS_VERSION: ${{ matrix.sylius }}
          PHP_VERSION: ${{ matrix.php }}
        run: pnpm --dir e2e e2e:start

      - name: Run Playwright
        run: pnpm --dir e2e e2e

      # In the job log, not in an artifact: log masking covers only the job log. When start.sh
      # failed before it masked the tunnel host, the tunnel log still holds it.
      - name: Print the stack logs
        if: failure()
        run: |
          for host in $(docker compose -f e2e/compose.yaml logs --no-color tunnel 2>/dev/null | grep -oE '[a-z0-9-]+\.trycloudflare\.com' | sort -u); do
            echo "::add-mask::$host"
          done
          docker compose -f e2e/compose.yaml logs --no-color --tail 300

      - name: Stop the e2e stack
        id: stop
        if: always()
        run: pnpm --dir e2e e2e:stop

      # Log masking does not cover uploaded files: the report and traces show the tunnel host.
      # Uploaded only after the stop closed the tunnel, so no artifact holds a live host. The key
      # never reaches the browser.
      - name: Upload the report and traces
        if: failure() && steps.stop.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-php-${{ matrix.php }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore
