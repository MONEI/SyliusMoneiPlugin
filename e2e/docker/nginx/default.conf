# cloudflared reaches this server over plain HTTP and sends X-Forwarded-Proto: https. PHP sees
# HTTPS on for those requests, so Sylius builds https callback and return URLs on the tunnel host.
map $http_x_forwarded_proto $fastcgi_https {
    https on;
    default '';
}

server {
    listen 80;
    server_name _;
    root /app/vendor/sylius/test-application/public;
    client_max_body_size 8m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $fastcgi_https;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
